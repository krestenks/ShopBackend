#Gradle Daemon JVM criteria (see `./gradlew updateDaemonJvm`).
#Pin the Gradle daemon to Java 17: Kotlin 1.9.10's compiler cannot parse newer Java
#version strings (e.g. Java 26). This makes Gradle use an installed JDK 17 toolchain for
#the local build (the jar is built here and deployed to the local Linux boxes).
toolchainVersion=17
